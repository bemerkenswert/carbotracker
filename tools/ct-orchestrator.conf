# Carbotracker orchestrator configuration.
# Sourced by ct-orchestrator.sh. Override any value here to tune the daemon.

# How often to poll GitHub for candidate tickets, in seconds.
ORCHESTRATOR_POLL_INTERVAL_SECONDS=300

# Maximum number of concurrently active tickets.
ORCHESTRATOR_CONCURRENCY_CAP=3

# Labels a candidate issue must carry (comma-separated).
ORCHESTRATOR_ISSUE_LABELS=ready-for-agent,ticket

# Label applied on claim (ready-for-agent is removed, taking the issue out
# of every orchestrator's candidate query so parallel daemons cannot
# double-claim it).
ORCHESTRATOR_IN_PROGRESS_LABEL=in-progress

# Consecutive failed /review-comments rounds before the orchestrator pauses
# polling for manual intervention. Each failure posts a visible notice on
# the PR.
ORCHESTRATOR_REVIEW_RETRIES=3

# The model every headless opencode run uses, in provider/model form. Pinned
# so the agent pipeline never drifts to opencode's (pricier) default.
ORCHESTRATOR_MODEL=opencode-go/deepseek-v4-flash

# JSON state file tracking active tickets.
ORCHESTRATOR_STATE_FILE="$HOME/.local/state/carbotracker/orchestrator.json"

# Parent directory where ticket worktrees are created.
ORCHESTRATOR_WORKTREE_PARENT="$HOME/git/worktrees/carbotracker"
