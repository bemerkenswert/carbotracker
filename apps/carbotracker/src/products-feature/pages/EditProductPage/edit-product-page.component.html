@if (viewModel().product; as product) {
  <ng-container>
    <ctui-toolbar
      [title]="viewModel().pageTitle"
      [showBackwardNavigation]="true"
      (backwardNavigation)="onGoBack()"
    >
      <button
        mat-icon-button
        (click)="onDeleteClicked(product)"
        matTooltip="Delete product"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </ctui-toolbar>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <mat-form-field>
        <mat-label>Product name</mat-label>
        <input [formControl]="formGroup.controls.name" type="text" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Carbohydrates per 100g</mat-label>
        <input [formControl]="formGroup.controls.carbs" type="number" matInput />
      </mat-form-field>
      <button
        color="primary"
        type="submit"
        [disabled]="formGroup.invalid || formGroup.pristine"
        mat-fab
        ctuiFixedPosition
        matTooltip="Save product"
      >
        <mat-icon>save</mat-icon>
      </button>
    </form>
  </ng-container>
} @else {
  <ng-template> Loading the selected product... </ng-template>
}
