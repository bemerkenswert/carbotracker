<ctui-toolbar
  title="Account"
  [showBackwardNavigation]="true"
  (backwardNavigation)="onGoBack()"
></ctui-toolbar>
<form [formGroup]="accountFormGroup" (submit)="onSaveChanges()">
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input
      matInput
      formControlName="email"
      (focus)="onInputInteracted()"
      (click)="onInputInteracted()"
    />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password</mat-label>
    <input
      type="password"
      matInput
      value="********"
      (click)="onInputInteracted()"
      (focus)="onFocusPasswordInput()"
    />
  </mat-form-field>
  <button
    color="primary"
    mat-raised-button
    type="submit"
    [disabled]="accountFormGroup.pristine"
  >
    Save changes
  </button>
</form>
