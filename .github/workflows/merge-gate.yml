# Merge gate for carbotracker PRs.
#
# Required status check (branch protection on main): the job fails iff the PR
# carries the suspect-diff label without the human-approved label, and passes
# otherwise. Re-evaluated on every PR open/sync/re-label event, so a flagged
# PR stays unmergeable until a maintainer adds human-approved (or removes
# suspect-diff), and un-flagging flips the gate green immediately.
name: Merge gate
permissions: {}
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - name: check merge gate labels
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          # Fail closed: a jq error (exit > 1) is treated as a gate failure,
          # never as a pass, so a tooling hiccup cannot green-light a flagged PR.
          set +e
          printf '%s' "$PR_LABELS" | jq -e 'any(.[]; .name == "suspect-diff")' >/dev/null 2>&1
          suspect=$?
          printf '%s' "$PR_LABELS" | jq -e 'any(.[]; .name == "human-approved")' >/dev/null 2>&1
          approved=$?
          set -e
          if [[ "$suspect" -gt 1 || "$approved" -gt 1 ]]; then
            echo "Merge gate: could not read the PR's labels; failing closed." >&2
            exit 1
          fi
          if [[ "$suspect" -eq 0 && "$approved" -ne 0 ]]; then
            echo "Merge gate: PR carries the suspect-diff label without human-approved." >&2
            echo "Merge gate: a maintainer must review the diff and add human-approved before this can merge." >&2
            exit 1
          fi
          echo "Merge gate: ok"
